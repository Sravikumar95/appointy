<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Appointments — Appointy Doctor</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="app-layout">
  <div class="main-content">

    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; flex-wrap:wrap; gap:12px;">
      <h2 class="page-title" style="margin:0">Patient Appointments</h2>
      <div style="display:flex; gap:10px; align-items:center;">
        <select id="filter-status" onchange="filterTable()"
          style="padding:8px 14px; border:1.5px solid var(--gray-200); border-radius:99px; outline:none; font-size:13px; color:var(--gray-700); background:white;">
          <option value="all">All Appointments</option>
          <option value="pending">Pending</option>
          <option value="confirmed">Confirmed</option>
          <option value="completed">Completed</option>
          <option value="cancelled">Cancelled</option>
        </select>
        <input type="text" id="search" placeholder="🔍 Search patient name..."
          style="padding:8px 14px; border:1.5px solid var(--gray-200); border-radius:99px; outline:none; width:220px; font-size:13px;"
          oninput="filterTable()">
      </div>
    </div>

    <div class="card">
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>#</th>
              <th>Patient</th>
              <th>Age / Gender</th>
              <th>Date &amp; Time</th>
              <th>Consultation Fee</th>
              <th>Payment</th>
              <th>Status</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="appt-tbody">
            <tr><td colspan="8"><div class="empty-state"><div class="es-icon">⏳</div><p>Loading appointments...</p></div></td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>
</div>

<script src="../js/utils.js"></script>
<script src="../js/layout.js"></script>
<script>
  renderLayout('doctor');

  let allAppts = [];

  document.addEventListener('DOMContentLoaded', () => {
    loadAppointments();
  });

  async function loadAppointments() {
    try {
      const data = await api('GET', '/api/doctor/appointments');
      if (!data.success) {
        showToast(data.message || 'Failed to load appointments', 'error');
        return;
      }
      allAppts = data.appointments || [];
      renderTable(allAppts);
    } catch(e) {
      showToast('Network error while loading appointments', 'error');
    }
  }

  function renderTable(appts) {
    const tbody = document.getElementById('appt-tbody');
    if (!appts.length) {
      tbody.innerHTML = `<tr><td colspan="8"><div class="empty-state"><div class="es-icon">📭</div><p>No appointments found</p></div></td></tr>`;
      return;
    }

    tbody.innerHTML = appts.map((a, i) => {
      const p = a.userData || {};
      const statusBadge = `<span class="badge badge-${a.status}">${a.status.toUpperCase()}</span>`;
      
      let actions = '';
      if (a.status === 'pending') {
        actions = `
          <button class="btn-primary" style="padding:4px 10px; font-size:11px; background:var(--success); margin-right:4px;" onclick="changeStatus(${a.id}, 'confirmed')">Confirm</button>
          <button class="btn-cancel" style="padding:4px 10px; font-size:11px;" onclick="changeStatus(${a.id}, 'cancelled')">Reject</button>
        `;
      } else if (a.status === 'confirmed') {
        actions = `
          <button class="btn-primary" style="padding:4px 10px; font-size:11px; background:var(--primary); margin-right:4px;" onclick="changeStatus(${a.id}, 'completed')">Complete</button>
          <button class="btn-cancel" style="padding:4px 10px; font-size:11px;" onclick="changeStatus(${a.id}, 'cancelled')">Cancel</button>
        `;
      } else {
        actions = `<span style="color:var(--gray-400); font-size:12px;">No action needed</span>`;
      }

      return `
        <tr>
          <td>${i + 1}</td>
          <td>
            <div class="doc-avatar">
              <div style="width:36px; height:36px; border-radius:50%; background:var(--primary-light); color:var(--primary); display:flex; align-items:center; justify-content:center; font-weight:700;">
                ${(p.name || 'P')[0]}
              </div>
              <div>
                <div class="doc-name">${p.name || 'Anonymous'}</div>
                <div class="doc-spec" style="font-size:11px; color:var(--gray-500)">${p.phone || p.email || ''}</div>
              </div>
            </div>
          </td>
          <td>
            ${calcAge(p.dob)} yrs<br>
            <span style="color:var(--gray-500); font-size:12px">${p.gender || '—'}</span>
          </td>
          <td>
            ${formatDate(a.slotDate)}<br>
            <span style="color:var(--gray-500); font-size:12px">${a.slotTime || ''}</span>
          </td>
          <td>${formatFee(a.amount)}</td>
          <td>
            <span class="badge badge-green">${a.payment ? 'Online (Paid)' : 'Pending'}</span>
          </td>
          <td>${statusBadge}</td>
          <td>${actions}</td>
        </tr>
      `;
    }).join('');
  }

  function filterTable() {
    const status = document.getElementById('filter-status').value;
    const q = document.getElementById('search').value.toLowerCase().trim();

    let filtered = allAppts;

    if (status !== 'all') {
      filtered = filtered.filter(a => a.status === status);
    }

    if (q) {
      filtered = filtered.filter(a => (a.userData?.name || '').toLowerCase().includes(q));
    }

    renderTable(filtered);
  }

  async function changeStatus(appointmentId, status) {
    const actionLabel = status === 'confirmed' ? 'confirm' : (status === 'completed' ? 'mark as completed' : 'reject/cancel');
    if (!confirm(`Are you sure you want to ${actionLabel} this appointment?`)) return;

    const res = await api('PUT', `/api/doctor/appointments/${appointmentId}/status`, { status });
    if (res.success) {
      showToast(res.message || 'Status updated', 'success');
      loadAppointments();
    } else {
      showToast(res.message || 'Action failed', 'error');
    }
  }
</script>

</body>
</html>
