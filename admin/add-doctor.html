<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add Doctor — Appointy Admin</title>
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div class="app-layout">
  <div class="main-content">

    <h2 class="page-title">Add New Doctor</h2>

    <div class="form-card">

      <!-- Image Upload Area -->
      <div style="margin-bottom:24px;">
        <label style="font-size:13px; font-weight:600; color:var(--gray-700); display:block; margin-bottom:8px;">Doctor Profile Photo</label>
        <div class="upload-area" onclick="document.getElementById('img-input').click()">
          <img id="preview-img" src="" alt="Preview" style="display:none; width:100%; height:100%; object-fit:cover; border-radius:8px;">
          <div id="upload-placeholder">
            <div style="font-size:36px">📷</div>
            <p>Click to upload doctor photo</p>
            <p style="font-size:11px; margin-top:4px; color:var(--gray-400)">JPG, PNG, WebP — max 5MB</p>
          </div>
        </div>
        <input type="file" id="img-input" accept="image/*" style="display:none" onchange="previewImage(event)">
      </div>

      <!-- Form Grid -->
      <div class="form-grid">

        <div class="field">
          <label>Full Name <span style="color:var(--danger)">*</span></label>
          <input type="text" id="f-name" placeholder="Dr. John Smith">
        </div>

        <div class="field">
          <label>Email Address <span style="color:var(--danger)">*</span></label>
          <input type="email" id="f-email" placeholder="doctor@appointy.com">
        </div>

        <div class="field">
          <label>Password <span style="color:var(--danger)">*</span></label>
          <input type="password" id="f-password" placeholder="At least 6 characters">
        </div>

        <div class="field">
          <label>Consultation Fees (₹) <span style="color:var(--danger)">*</span></label>
          <input type="number" id="f-fees" placeholder="500">
        </div>

        <div class="field">
          <label>Speciality <span style="color:var(--danger)">*</span></label>
          <select id="f-speciality">
            <option value="">Select speciality</option>
            <option>General physician</option>
            <option>Gynecologist</option>
            <option>Dermatologist</option>
            <option>Pediatricians</option>
            <option>Neurologist</option>
            <option>Gastroenterologist</option>
          </select>
        </div>

        <div class="field">
          <label>Experience <span style="color:var(--danger)">*</span></label>
          <select id="f-experience">
            <option value="">Select experience</option>
            <option>1 Year</option>
            <option>2 Years</option>
            <option>3 Years</option>
            <option>5 Years</option>
            <option>8 Years</option>
            <option>10 Years</option>
            <option>15+ Years</option>
          </select>
        </div>

        <div class="field">
          <label>Degree / Qualifications <span style="color:var(--danger)">*</span></label>
          <input type="text" id="f-degree" placeholder="MBBS, MD...">
        </div>

        <div class="field">
          <!-- spacer -->
        </div>

        <div class="field">
          <label>Clinic Address Line 1</label>
          <input type="text" id="f-addr1" placeholder="Street / Building">
        </div>

        <div class="field">
          <label>Clinic Address Line 2</label>
          <input type="text" id="f-addr2" placeholder="City, State">
        </div>

        <div class="field full">
          <label>About Doctor</label>
          <textarea id="f-about" rows="3" placeholder="Write about doctor experience, clinical expertise, and background..."></textarea>
        </div>

      </div>

      <div style="margin-top:24px; display:flex; justify-content:flex-end; gap:12px;">
        <button class="btn-cancel" onclick="window.location.href='doctors-list.html'">Cancel</button>
        <button class="btn-submit" id="btn-save-doc" onclick="submitDoctor()">Add Doctor</button>
      </div>

    </div>

  </div>
</div>

<script src="../js/utils.js"></script>
<script src="../js/layout.js"></script>
<script>
  renderLayout('admin');

  let selectedPhotoFile = null;

  function previewImage(event) {
    const file = event.target.files[0];
    if (!file) return;

    selectedPhotoFile = file;
    const reader = new FileReader();
    reader.onload = e => {
      const preview = document.getElementById('preview-img');
      preview.src = e.target.result;
      preview.style.display = 'block';
      document.getElementById('upload-placeholder').style.display = 'none';
    };
    reader.readAsDataURL(file);
  }

  async function submitDoctor() {
    const name        = document.getElementById('f-name').value.trim();
    const email       = document.getElementById('f-email').value.trim();
    const password    = document.getElementById('f-password').value;
    const fees        = document.getElementById('f-fees').value.trim();
    const speciality  = document.getElementById('f-speciality').value;
    const experience  = document.getElementById('f-experience').value;
    const degree      = document.getElementById('f-degree').value.trim();
    const address1    = document.getElementById('f-addr1').value.trim();
    const address2    = document.getElementById('f-addr2').value.trim();
    const about       = document.getElementById('f-about').value.trim();

    if (!name || !email || !password || !fees || !speciality || !experience || !degree) {
      showToast('Please fill in all required fields (*)', 'error');
      return;
    }

    const btn = document.getElementById('btn-save-doc');
    btn.disabled = true;
    btn.textContent = 'Adding doctor...';

    const formData = new FormData();
    formData.append('name', name);
    formData.append('email', email);
    formData.append('password', password);
    formData.append('fees', fees);
    formData.append('speciality', speciality);
    formData.append('experience', experience);
    formData.append('degree', degree);
    formData.append('address1', address1);
    formData.append('address2', address2);
    formData.append('about', about);

    if (selectedPhotoFile) {
      formData.append('image', selectedPhotoFile);
    }

    try {
      const res = await api('POST', '/api/admin/doctors', formData, null, true);
      if (res.success) {
        showToast('Doctor added successfully!', 'success');
        setTimeout(() => {
          window.location.href = 'doctors-list.html';
        }, 1200);
      } else {
        showToast(res.message || 'Failed to add doctor', 'error');
        btn.disabled = false;
        btn.textContent = 'Add Doctor';
      }
    } catch (e) {
      showToast('Network error while saving doctor', 'error');
      btn.disabled = false;
      btn.textContent = 'Add Doctor';
    }
  }
</script>

</body>
</html>
